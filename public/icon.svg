<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Tensor Matrix Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="336" x2="416" y2="336" />
    <line x1="96" y1="416" x2="416" y2="416" />
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
  </g>

  <!-- Central 3D Tensor / Neural Cube -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Isometric Top -->
    <polygon points="0,-120 110,-55 0,10 -110,-55" fill="url(#glass)" opacity="0.9" />
    <!-- Isometric Left -->
    <polygon points="-110,-55 0,10 0,135 -110,70" fill="url(#accent)" opacity="0.85" />
    <!-- Isometric Right -->
    <polygon points="0,10 110,-55 110,70 0,135" fill="url(#glass)" opacity="0.75" />

    <!-- Inner Synapse Nodes -->
    <circle cx="0" cy="-55" r="9" fill="#ffffff" />
    <circle cx="-55" cy="-22" r="7" fill="#ffffff" opacity="0.9" />
    <circle cx="55" cy="-22" r="7" fill="#ffffff" opacity="0.9" />
    <circle cx="0" cy="10" r="11" fill="#ffffff" />
    <circle cx="-55" cy="42" r="7" fill="#ffffff" opacity="0.9" />
    <circle cx="55" cy="42" r="7" fill="#ffffff" opacity="0.9" />
    <circle cx="0" cy="75" r="8" fill="#ffffff" opacity="0.95" />

    <!-- Inner Synapse Lines -->
    <line x1="0" y1="-55" x2="-55" y2="-22" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="0" y1="-55" x2="55" y2="-22" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="-55" y1="-22" x2="0" y2="10" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="55" y1="-22" x2="0" y2="10" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="0" y1="10" x2="-55" y2="42" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="0" y1="10" x2="55" y2="42" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="-55" y1="42" x2="0" y2="75" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
    <line x1="55" y1="42" x2="0" y2="75" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />

    <!-- Glass Highlights -->
    <path d="M 0,-115 L 100,-58" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="0" y1="10" x2="0" y2="130" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  </g>
</svg>
